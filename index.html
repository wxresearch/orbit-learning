<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Orbit — Your Learning Space</title>
<style>
:root{font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:#27334b;background:#f7f9fe}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid #b5aaff}.app{min-height:100vh;display:grid;grid-template-columns:225px minmax(0,1fr)}aside{background:white;border-right:1px solid #e7eaf3;padding:26px 15px;display:flex;flex-direction:column;gap:20px}.brand{font-size:26px;font-weight:900;letter-spacing:-1px;padding:12px;color:#6c57dc}.brand span{background:#765ce6;color:white;border-radius:12px;padding:6px;margin-right:8px}nav{display:grid;gap:6px}nav button{border:0;background:transparent;border-radius:12px;padding:14px;text-align:left;color:#626e87;font-weight:700}nav button.active,nav button:hover{color:#6750d9;background:#eeeaff}main{max-width:1240px;width:100%;margin:0 auto;padding:35px 44px 80px}.top{display:flex;gap:12px;align-items:center;justify-content:space-between}.stats{display:flex;gap:8px;flex-wrap:wrap}.pill{padding:10px 13px;border-radius:30px;background:white;border:1px solid #e8ebf2;font-weight:700}h1{font-size:32px;letter-spacing:-1px;margin:9px 0}h2{font-size:21px;margin:0 0 15px}h3{margin:0 0 8px}p{color:#718097;line-height:1.6;margin:0 0 12px}.muted{font-size:13px;color:#7b879d}.eyebrow{color:#8a94a9;text-transform:uppercase;letter-spacing:.1em;font-size:12px;font-weight:800}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.card{background:white;border:1px solid #e9ecf4;border-radius:20px;padding:22px;box-shadow:0 3px 16px #21345b08}.hero{display:grid;grid-template-columns:1fr auto;align-items:center;background:linear-gradient(110deg,#eeeaff,#e7f9f7);border-radius:24px;padding:28px;margin:23px 0;gap:15px}.mascot{width:150px;height:150px;position:relative;flex:none;display:grid;place-items:center;filter:drop-shadow(0 12px 11px #4d60a52a);animation:floatpip 4s ease-in-out infinite}.mascot .orbit-ring{position:absolute;width:154px;height:62px;border:12px solid #aa91ed;border-left-color:#c6b7fa;border-right-color:#8871dc;border-radius:50%;transform:rotate(-24deg);z-index:0}.mascot .planet{position:relative;z-index:1;width:108px;height:108px;border-radius:50%;background:linear-gradient(145deg,#b3f7ed,#81ddeb 70%,#7aa8e8);box-shadow:inset -12px -11px 0 #65b6d429,inset 7px 8px 0 #ffffff55;border:3px solid #ffffffa3}.mascot .eye{position:absolute;width:12px;height:17px;background:#283a62;border-radius:50%;top:42px}.mascot .eye.left{left:28px}.mascot .eye.right{right:28px}.mascot .eye:after{content:'';position:absolute;width:4px;height:5px;left:2px;top:2px;border-radius:50%;background:white}.mascot .smile{position:absolute;left:46px;top:59px;width:15px;height:10px;border-bottom:3px solid #334567;border-radius:50%}.mascot .blush{position:absolute;top:61px;width:19px;height:9px;background:#f8a8ba88;border-radius:50%}.mascot .blush.left{left:12px}.mascot .blush.right{right:12px}.mascot .star{position:absolute;z-index:3;color:#f4b94d;font-size:23px;top:3px;right:-4px}.mascot .planet:after{content:'';position:absolute;z-index:3;width:120px;height:39px;border-bottom:10px solid #9175df;border-radius:50%;left:-10px;top:42px;transform:rotate(-24deg);pointer-events:none}@keyframes floatpip{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}@media(prefers-reduced-motion:reduce){.mascot{animation:none}}.btn{background:#7059e8;color:white;border:0;border-radius:12px;padding:12px 18px;font-weight:800}.btn:hover{background:#5842cf}.btn.secondary{background:#eeeaff;color:#6852d3}.btn:disabled{opacity:.5;cursor:default}.section{margin:26px 0}.emoji{font-size:30px}.progress{height:10px;background:#e9edf5;border-radius:20px;overflow:hidden}.bar{height:100%;background:#8067e9;border-radius:20px}.subject{display:flex;flex-direction:column;gap:9px}.subject button{margin-top:auto}.subject p{flex:1}label{font-weight:700;display:block;margin:16px 0 6px}.field{border:1px solid #d9e0ee;background:white;padding:11px 12px;border-radius:11px;width:100%;color:#29354d}textarea{min-height:118px;resize:vertical}.formgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:0 18px}.option{display:block;text-align:left;width:100%;padding:14px;border:1px solid #dfe4ef;background:white;margin:10px 0;border-radius:12px}.option:hover{background:#f5f2ff}.option.right{border-color:#25a47e;background:#e8faf4}.option.wrong{border-color:#e2798e;background:#fff0f3}.task{display:flex;gap:10px;align-items:flex-start;padding:12px;border-bottom:1px solid #ecedf3}.task input{margin-top:5px}small{color:#7e8aa0}footer{margin-top:auto;padding:12px;color:#9aa4b5;font-size:12px}.hidden{display:none!important}@media(max-width:940px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}main{padding:24px}.app{grid-template-columns:180px minmax(0,1fr)}}@media(max-width:680px){.app{display:block}aside{padding:12px;position:sticky;top:0;z-index:10;gap:6px;box-shadow:0 3px 9px #172d4c10}.brand{font-size:20px;padding:5px}nav{display:flex;overflow-x:auto;white-space:nowrap}nav button{padding:9px}footer{display:none}main{padding:20px 15px}.grid,.formgrid{grid-template-columns:1fr}.hero{padding:18px}.mascot{font-size:50px}.top{align-items:start;flex-direction:column}h1{font-size:26px}}
</style></head>
<body><div class="app"><aside><div class="brand"><span>✦</span>Orbit</div><nav id="nav"></nav><footer>Your space to learn anything ✨</footer></aside><main><div class="top"><div class="eyebrow">Your learning space</div><div class="stats"><span class="pill">🔥 <b id="streak">1</b> day streak</span><span class="pill">⚡ <b id="xp">0</b> XP</span></div></div><div id="view"></div></main></div>
<script>
const courses=[
{id:'amc10',title:'AMC 10',type:'Competition Math',icon:'🧠',color:'#7159d9',topics:['Algebra','Geometry','Counting and Probability','Number Theory','Problem-Solving Strategies']},
{id:'amc12',title:'AMC 12',type:'Competition Math',icon:'🏆',color:'#7159d9',topics:['Advanced Algebra','Geometry','Combinatorics','Number Theory','Trigonometry']},
{id:'sat',title:'SAT',type:'Standardized Test',icon:'🎯',color:'#278fb6',topics:['Algebra','Advanced Math','Problem Solving and Data Analysis','Geometry and Trigonometry','Reading and Writing']},
{id:'act',title:'ACT',type:'Standardized Test',icon:'🚀',color:'#278fb6',topics:['English','Math','Reading','Science Reasoning']},
{id:'apcalc',title:'AP Calculus BC',type:'AP Course',icon:'📐',color:'#e6a342',topics:['Limits and Continuity','Differentiation','Applications of Derivatives','Integration and Accumulation of Change','Differential Equations','Applications of Integration','Parametric Equations, Polar Coordinates, and Vector-Valued Functions','Infinite Sequences and Series']},
{id:'apphysics',title:'AP Physics 1',type:'AP Course',icon:'⚛️',color:'#6f72d9',topics:['Kinematics','Force and Translational Dynamics','Work, Energy, and Power','Linear Momentum','Torque and Rotational Dynamics','Energy and Momentum of Rotating Systems','Oscillations','Fluids']},
{id:'apenv',title:'AP Environmental Science',type:'AP Course',icon:'🌿',color:'#26a18a',topics:['The Living World: Ecosystems','The Living World: Biodiversity','Populations','Earth Systems and Resources','Land and Water Use','Energy Resources and Consumption','Atmospheric Pollution','Aquatic and Terrestrial Pollution','Global Change']},
{id:'apstats',title:'AP Statistics',type:'AP Course',icon:'📊',color:'#bd6fbe',topics:['Exploring One-Variable Data','Exploring Two-Variable Data','Collecting Data','Probability, Random Variables, and Probability Distributions','Sampling Distributions','Inference for Categorical Data: Proportions','Inference for Quantitative Data: Means','Inference for Categorical Data: Chi-Square','Inference for Quantitative Data: Slopes']},
{id:'apeuro',title:'AP European History',type:'AP Course',icon:'🏛️',color:'#d88151',topics:['Renaissance and Exploration','Age of Reformation','Absolutism and Constitutionalism','Scientific, Philosophical, and Political Developments','Conflict, Crisis, and Reaction','Industrialization and Its Effects','19th-Century Perspectives and Political Developments','20th-Century Global Conflicts','Cold War and Contemporary Europe']},
{id:'science',title:'School Science',type:'School Class',icon:'🔬',color:'#259e88',topics:['Biology','Chemistry','Physics','Earth Science']},
{id:'english',title:'English',type:'School Class',icon:'📚',color:'#cd7a72',topics:['Grammar','Reading','Writing','Literature']},
{id:'history',title:'History',type:'School Class',icon:'🌍',color:'#b88a44',topics:['World History','Civics','Geography','Historical Analysis']}
];
const questions=[
{course:'amc10',topic:'Algebra',q:'If 3x + 7 = 25, what is x?',a:['5','6','7','8'],correct:1,why:'Subtract 7 to get 3x = 18, then divide by 3.'},
{course:'amc12',topic:'Combinatorics',q:'How many ways can you choose 2 students from 6?',a:['12','15','30','36'],correct:1,why:'There are (6 × 5)/2 = 15 unordered pairs.'},
{course:'sat',topic:'Algebra',q:'If 2(x − 3) = 14, what is x?',a:['4','7','10','17'],correct:2,why:'Divide by 2: x − 3 = 7, so x = 10.'},
{course:'sat',topic:'Reading and Writing',q:'Choose the grammatically correct sentence.',a:['Each of the students have a book.','Each of the students has a book.','Each students has a book.','Each of the student have a book.'],correct:1,why:'The singular subject “each” takes the singular verb “has.”'},
{course:'act',topic:'Math',q:'A right triangle has legs 6 and 8. What is its hypotenuse?',a:['9','10','12','14'],correct:1,why:'By the Pythagorean theorem, the hypotenuse is the square root of 36 + 64 = 10.'},
{course:'act',topic:'Science Reasoning',q:'In an experiment, which variable is deliberately changed by the researcher?',a:['Dependent variable','Controlled variable','Independent variable','Response variable'],correct:2,why:'The independent variable is manipulated; the dependent variable is measured.'},
{course:'apcalc',topic:'Differentiation',q:'What is the derivative of x³?',a:['x²','3x²','3x','x⁴/4'],correct:1,why:'Use the power rule: d(xⁿ)/dx = nxⁿ⁻¹.'},
{course:'apphysics',topic:'Kinematics',q:'Starting from rest at constant acceleration 2 m/s², what is velocity after 5 s?',a:['2 m/s','5 m/s','10 m/s','25 m/s'],correct:2,why:'v = u + at = 0 + (2)(5) = 10 m/s.'},
{course:'apenv',topic:'Populations',q:'Which term describes the maximum population size an environment can sustainably support?',a:['Birth rate','Carrying capacity','Growth rate','Population density'],correct:1,why:'Carrying capacity is the largest population an environment can support over time.'},
{course:'apstats',topic:'Exploring One-Variable Data',q:'Which statistic is most resistant to extreme outliers?',a:['Mean','Range','Median','Standard deviation'],correct:2,why:'The median is based on order and is less influenced by extreme values.'},
{course:'apeuro',topic:'Renaissance and Exploration',q:'Which movement emphasized classical learning and human potential during the Renaissance?',a:['Humanism','Romanticism','Realism','Mercantilism'],correct:0,why:'Renaissance humanism emphasized classical texts, education, and human abilities.'},
{course:'science',topic:'Chemistry',q:'What is the chemical symbol for sodium?',a:['S','So','Na','N'],correct:2,why:'Na comes from sodium’s Latin name, natrium.'},
{course:'english',topic:'Grammar',q:'Which word is an adverb in “She spoke softly”?',a:['She','spoke','softly','none'],correct:2,why:'Softly describes how she spoke.'},
{course:'history',topic:'World History',q:'Which ancient civilization built the pyramids at Giza?',a:['Romans','Egyptians','Greeks','Persians'],correct:1,why:'The Giza pyramids were built in ancient Egypt.'}
];
let state;try{state=JSON.parse(localStorage.getItem('orbit-v1'))||{}}catch{state={}}state.xp=state.xp||0;state.done=state.done||{};state.tasks=state.tasks||[];state.streak=Number.isFinite(state.streak)?state.streak:0;
// Legacy builds awarded a one-day streak simply for opening the site.
if(!state.lastStudyDate){state.streak=0;}
function studyDay(){return new Date().toLocaleDateString('en-CA');}
function recordActivity(){const today=studyDay();if(state.lastStudyDate===today)return;const yesterday=new Date();yesterday.setDate(yesterday.getDate()-1);const y=yesterday.toLocaleDateString('en-CA');state.streak=state.lastStudyDate===y?state.streak+1:1;state.lastStudyDate=today;}
function currentStreak(){if(!state.lastStudyDate)return 0;const today=studyDay();const yesterday=new Date();yesterday.setDate(yesterday.getDate()-1);return state.lastStudyDate===today||state.lastStudyDate===yesterday.toLocaleDateString('en-CA')?state.streak:0;}
let page='home',chosen='amc10',attempt=null;
function save(){localStorage.setItem('orbit-v1',JSON.stringify(state));document.getElementById('xp').textContent=state.xp;document.getElementById('streak').textContent=currentStreak()}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function go(p){page=p;attempt=null;render();window.scrollTo(0,0)}
function nav(){const entries=[['home','🏠 Home'],['courses','📚 Explore Courses'],['practice','✍️ Practice'],['planner','🗓️ Study Planner'],['progress','🏅 My Progress']];document.getElementById('nav').innerHTML=entries.map(function(e){return '<button class="'+(page===e[0]?'active':'')+'" data-page="'+e[0]+'">'+e[1]+'</button>'}).join('');document.querySelectorAll('[data-page]').forEach(function(b){b.onclick=function(){go(b.dataset.page)}})}
function tile(c){return '<div class="card subject"><div class="emoji">'+c.icon+'</div><h3>'+c.title+'</h3><p>'+c.type+' · '+c.topics.length+' topics</p><button class="btn secondary" data-course="'+c.id+'">Explore →</button></div>'}
function wireCourses(){document.querySelectorAll('[data-course]').forEach(function(b){b.onclick=function(){chosen=b.dataset.course;go('course')}})}
function home(){return '<div class="hero"><div><div class="eyebrow">Welcome back, explorer!</div><h1>Small steps. Big discoveries.</h1><p>Meet Pip, your study buddy. Pick up a lesson or build a study plan around your next exam.</p><button class="btn" data-page="courses">Start learning →</button></div><div class="mascot" role="img" aria-label="Pip, a smiling pastel planet with a lavender orbit ring"><span class="orbit-ring"></span><span class="planet"><span class="eye left"></span><span class="eye right"></span><span class="blush left"></span><span class="blush right"></span><span class="smile"></span></span><span class="star">✦</span></div></div><div class="section"><h2>Your learning tracks</h2><div class="grid">'+courses.slice(0,6).map(tile).join('')+'</div></div><div class="section card"><h2>Plan your next study session</h2><p>Preparing for AMC, SAT, ACT, an AP exam, or a school test? Turn your goals and notes into daily tasks.</p><button class="btn" data-page="planner">Create my plan →</button></div>'}
function course(){const c=courses.find(function(x){return x.id===chosen})||courses[0];return '<div class="section"><button class="btn secondary" data-page="courses">← All courses</button></div><h1>'+c.icon+' '+c.title+'</h1><p>'+c.type+' · Choose a topic to review, then practice.</p><div class="section grid">'+c.topics.map(function(t,i){return '<div class="card"><div class="eyebrow">Unit '+(i+1)+'</div><h3>'+esc(t)+'</h3><p>Review the main ideas and try a practice question.</p><button class="btn secondary" data-topic="'+i+'">Practice →</button></div>'}).join('')+'</div><p class="muted">Prototype content: these are topic outlines and sample questions, not a complete exam curriculum.</p>'}
function practice(){const relevant=questions.filter(function(q){return q.course===chosen});const list=relevant.length?relevant:questions;const item=list[0];return '<h1>✍️ Practice</h1><p>Get comfortable with the basics. Earn 20 XP for each new correct answer.</p><div class="section"><label for="practicecourse">Choose course</label><select class="field" id="practicecourse">'+courses.map(function(c){return '<option value="'+c.id+'" '+(chosen===c.id?'selected':'')+'>'+c.title+'</option>'}).join('')+'</select></div><div class="card section"><div class="eyebrow">'+esc(item.topic)+'</div><h2 style="margin-top:12px">'+esc(item.q)+'</h2>'+item.a.map(function(a,i){return '<button class="option '+(attempt!==null?(i===item.correct?'right':i===attempt?'wrong':''):'')+'" data-answer="'+i+'" '+(attempt!==null?'disabled':'')+'>'+String.fromCharCode(65+i)+'. '+esc(a)+'</button>'}).join('')+(attempt!==null?'<p><b>'+(attempt===item.correct?'Great work! 🎉':'Keep learning!')+'</b> '+esc(item.why)+'</p>':'')+'</div><p class="muted">Sample practice only. More questions and adaptive review are planned.</p>'}
function planner(){return '<h1>🗓️ Your Study Planner</h1><p>Turn your exam goal and pasted notes into a practical schedule. This version runs locally in your browser, without AI.</p><div class="card section"><div class="formgrid"><div><label for="plan-course">What are you studying?</label><select class="field" id="plan-course">'+courses.filter(function(c){return c.id!=='history'}).map(function(c){return '<option value="'+c.id+'">'+c.title+'</option>'}).join('')+'</select></div><div><label for="examdate">Exam date</label><input class="field" id="examdate" type="date"></div><div><label for="minutes">Minutes per day</label><select class="field" id="minutes"><option value="20">20 minutes</option><option value="30">30 minutes</option><option value="45" selected>45 minutes</option><option value="60">60 minutes</option><option value="90">90 minutes</option></select></div><div><label for="weak">Topics you find hardest</label><input class="field" id="weak" placeholder="e.g. factoring, probability"></div></div><label for="notes">Paste your notes (optional)</label><textarea class="field" id="notes" placeholder="Paste lesson notes, a study guide, or vocabulary here..."></textarea><label for="upload">Or upload a text file</label><input type="file" accept=".txt,.md,text/plain,text/markdown" id="upload" class="field"><p class="muted">Only .txt and .md files are supported in this prototype.</p><button class="btn" id="generate">Generate my plan ✨</button></div><div id="planresult"></div>'}
function makePlan(){const id=document.getElementById('plan-course').value,c=courses.find(function(x){return x.id===id}),raw=document.getElementById('notes').value,weak=document.getElementById('weak').value.split(',').map(function(t){return t.trim()}).filter(Boolean),topics=weak.concat(c.topics),lines=raw.split(/\n+/).map(function(x){return x.trim().replace(/^[-*#0-9. ]+/,'')}).filter(function(x){return x.length>5}).slice(0,12);const all=topics.concat(lines.length?lines:[]);let d=document.getElementById('examdate').value;let days=7;if(d){const date=new Date(d+'T12:00:00'),now=new Date();now.setHours(12,0,0,0);days=Math.ceil((date-now)/86400000)}days=Math.max(1,Math.min(60,days));const min=Number(document.getElementById('minutes').value);state.tasks=Array.from({length:days},function(_,i){return {label:'Day '+(i+1)+': '+all[i%all.length]+' — study '+Math.max(10,min-10)+' min, practice 10 min',done:false}});state.planCourse=c.title;save();showPlan()}
function showPlan(){const el=document.getElementById('planresult');if(!el)return;if(!state.tasks.length){el.innerHTML='';return}el.innerHTML='<div class="card section"><h2>✨ '+esc(state.planCourse||'Your')+' study plan</h2><p>Check off each day as you finish it. Revisit weak topics during review.</p>'+state.tasks.map(function(t,i){return '<label class="task"><input type="checkbox" data-task="'+i+'" '+(t.done?'checked':'')+'><span>'+esc(t.label)+'</span></label>'}).join('')+'<button class="btn secondary" id="download">Download plan</button></div>';document.querySelectorAll('[data-task]').forEach(function(el){el.onchange=function(){state.tasks[Number(el.dataset.task)].done=el.checked;if(el.checked)recordActivity();save()}});document.getElementById('download').onclick=function(){const blob=new Blob([state.tasks.map(function(t){return (t.done?'[x] ':'[ ] ')+t.label}).join('\n')],{type:'text/plain'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='orbit-study-plan.txt';a.click();URL.revokeObjectURL(a.href)}}
function progress(){const finished=Object.keys(state.done).length;return '<h1>🏅 Your Progress</h1><div class="grid section"><div class="card"><div class="emoji">⚡</div><h2>'+state.xp+' XP</h2><p>Total earned</p></div><div class="card"><div class="emoji">✅</div><h2>'+finished+'</h2><p>Practice questions mastered</p></div><div class="card"><div class="emoji">🗓️</div><h2>'+state.tasks.filter(function(t){return t.done}).length+'/'+state.tasks.length+'</h2><p>Study-plan tasks completed</p></div></div><p>Progress is stored in this browser only. It does not sync between devices.</p>'}
function render(){nav();const el=document.getElementById('view');el.innerHTML=page==='home'?home():page==='courses'?'<h1>Explore courses</h1><p>Competition math, standardized tests, AP, and everyday school subjects.</p><div class="section grid">'+courses.map(tile).join('')+'</div>':page==='course'?course():page==='practice'?practice():page==='planner'?planner():progress();document.querySelectorAll('[data-page]').forEach(function(b){b.onclick=function(){go(b.dataset.page)}});wireCourses();if(page==='course'){document.querySelectorAll('[data-topic]').forEach(function(b){b.onclick=function(){go('practice')}})}if(page==='practice'){document.getElementById('practicecourse').onchange=function(e){chosen=e.target.value;attempt=null;render()};document.querySelectorAll('[data-answer]').forEach(function(b){b.onclick=function(){attempt=Number(b.dataset.answer);const q=questions.find(function(x){return x.course===chosen})||questions[0];if(attempt===q.correct&&!state.done[chosen]){state.done[chosen]=true;state.xp+=20;recordActivity();save()}render()}})}if(page==='planner'){document.getElementById('generate').onclick=makePlan;document.getElementById('upload').onchange=async function(e){const f=e.target.files[0];if(f){if(f.size>200000){alert('Please upload a text file smaller than 200 KB.');return}document.getElementById('notes').value=await f.text()}};showPlan()}}
save();render();
</script></body></html>
