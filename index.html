/* Orbit visual polish: ambient blue-lavender gradients without blocking content */
body{overflow-x:hidden;background:radial-gradient(circle at 91% 7%,rgba(115,151,255,.13),transparent 26%),radial-gradient(circle at 25% 35%,rgba(155,125,246,.09),transparent 30%),linear-gradient(160deg,#f9fbff 0%,#f5f7ff 63%,#f8fbff 100%)}
main{position:relative;isolation:isolate}
main::before,main::after{content:"";position:absolute;z-index:-1;pointer-events:none;border-radius:50%}
main::before{width:300px;height:300px;top:90px;right:-90px;background:radial-gradient(circle,rgba(114,138,247,.17),transparent 70%)}
main::after{width:260px;height:260px;top:690px;left:-110px;background:radial-gradient(circle,rgba(158,107,239,.13),transparent 72%)}
.hero{position:relative;isolation:isolate;overflow:hidden;background:linear-gradient(120deg,#ebe9ff 0%,#e9f4ff 55%,#f0eaff 100%);border:1px solid #dcdcff;box-shadow:0 16px 38px rgba(77,92,170,.09)}
.hero::before,.hero::after{content:"";position:absolute;z-index:-1;pointer-events:none;border-radius:50%}
.hero::before{width:220px;height:220px;top:-130px;left:-55px;background:radial-gradient(circle,rgba(134,106,245,.26),transparent 70%)}
.hero::after{width:230px;height:230px;bottom:-140px;right:-60px;background:radial-gradient(circle,rgba(85,165,255,.25),transparent 70%)}
.card{background:rgba(255,255,255,.94);border:1px solid #e5e9f8;box-shadow:0 8px 25px rgba(58,72,129,.055);transition:box-shadow .18s ease,border-color .18s ease}
.card:hover{border-color:#d5d5f3;box-shadow:0 12px 28px rgba(64,77,147,.09)}
.subject{position:relative;overflow:hidden}
.subject::before{content:"";height:3px;position:absolute;top:0;left:0;right:0;background:linear-gradient(90deg,#8d70e9,#68aafa)}
.subject .emoji{color:#7063d5;display:inline-flex;align-items:center;justify-content:center;width:46px;height:46px;border-radius:14px;background:linear-gradient(135deg,#f0ebff,#e7f2ff)}
aside{background:linear-gradient(175deg,#fff 0%,#f7f8ff 100%);position:relative;overflow:hidden}
aside::before{content:"";position:absolute;width:170px;height:170px;top:-95px;right:-100px;border-radius:50%;background:radial-gradient(circle,rgba(146,111,248,.18),transparent 72%);pointer-events:none}
.brand span{background:linear-gradient(135deg,#7962e9,#5c92ef)}
.btn:not(.secondary){background:linear-gradient(120deg,#7359e5,#628af0);box-shadow:0 6px 15px rgba(110,102,215,.14)}
.btn:not(.secondary):hover{background:linear-gradient(120deg,#6246d5,#4f79dd)}
.btn.secondary{background:linear-gradient(120deg,#f1edff,#eaf2ff);color:#6352ce}
.nav-icon,.stat-icon{color:#7562de}
@media(max-width:680px){main::before{right:-160px;top:60px}main::after{left:-160px}.hero::after{right:-130px}.card:hover{box-shadow:0 8px 25px rgba(58,72,129,.055)}}
@media(prefers-reduced-motion:reduce){.card{transition:none}}

let state;try{state=JSON.parse(localStorage.getItem('orbit-v1'))||{}}catch{state={}}
if(!state||typeof state!=='object'||Array.isArray(state))state={};
state.done=state.done&&typeof state.done==='object'&&!Array.isArray(state.done)?state.done:{};
state.tasks=Array.isArray(state.tasks)?state.tasks:[];
state.xp=Number.isSafeInteger(state.xp)&&state.xp>=0?state.xp:0;
state.streak=Number.isSafeInteger(state.streak)&&state.streak>=0?state.streak:0;
function localDay(date=new Date()){return date.getFullYear()+'-'+String(date.getMonth()+1).padStart(2,'0')+'-'+String(date.getDate()).padStart(2,'0')}
function studyDay(){return localDay()}
function previousDay(){const d=new Date();d.setDate(d.getDate()-1);return localDay(d)}
if(!/^\\d{4}-\\d{2}-\\d{2}$/.test(state.lastStudyDate||'')){state.lastStudyDate=null;state.streak=0}
function recordActivity(){const today=studyDay();if(state.lastStudyDate===today)return;state.streak=state.lastStudyDate===previousDay()?state.streak+1:1;state.lastStudyDate=today}
function currentStreak(){if(!state.lastStudyDate)return 0;return state.lastStudyDate===studyDay()||state.lastStudyDate===previousDay()?state.streak:0}

/* Learning upgrades: source-aware question history, mastery, review, notes, and exams. */
state.attempts=Array.isArray(state.attempts)?state.attempts:[];
state.cards=Array.isArray(state.cards)?state.cards:[];
state.notes=Array.isArray(state.notes)?state.notes:[];
function questionKey(q){return q.course+':'+q.topic+':'+q.q}
function attemptsFor(q){const k=questionKey(q);return state.attempts.filter(a=>a.key===k)}
function difficulty(q){return q.level||((q.course==='amc10'||q.course==='amc12')?2:1)}
function mastery(course,topic){const a=state.attempts.filter(x=>x.course===course&&x.topic===topic).slice(-12);if(!a.length)return null;const weighted=a.reduce((n,x,i)=>n+(x.correct?1:0)*(i+1),0);return Math.round(100*weighted/(a.length*(a.length+1)/2))}
function adaptivePool(){let pool=questions.filter(q=>q.course===chosen&&(!selectedTopic||q.topic===selectedTopic));if(!pool.length)return pool;const topicScores=pool.map(q=>mastery(q.course,q.topic)).filter(v=>v!==null);const score=topicScores.length?topicScores.reduce((a,b)=>a+b,0)/topicScores.length:40;const target=score>=80?4:score>=65?3:score>=40?2:1;return pool.slice().sort((a,b)=>{const pa=attemptsFor(a),pb=attemptsFor(b);const sa=(pa.length?pa[pa.length-1].correct?8:-7:0)+Math.abs(difficulty(a)-target)*8+pa.length;const sb=(pb.length?pb[pb.length-1].correct?8:-7:0)+Math.abs(difficulty(b)-target)*8+pb.length;return sa-sb})}
function recordAnswer(q,right,seconds){state.attempts.push({key:questionKey(q),course:q.course,topic:q.topic,level:difficulty(q),correct:right,seconds:Math.max(0,seconds),at:Date.now()});state.attempts=state.attempts.slice(-2000);if(right&&!state.done[questionKey(q)]){state.done[questionKey(q)]=true;state.xp+=20;}recordActivity();save()}
function nextReview(){const wrong=state.attempts.filter(a=>!a.correct);return wrong.filter(a=>{const recent=state.attempts.filter(x=>x.key===a.key).at(-1);return recent===a}).length}
function analytics(){const a=state.attempts,correct=a.filter(x=>x.correct).length,avg=a.length?Math.round(100*correct/a.length):0;const rows=courses.flatMap(c=>c.topics.map(t=>({c,t,m:mastery(c.id,t)}))).filter(x=>x.m!==null).sort((x,y)=>x.m-y.m);return '<h1>'+ico('chart')+' Learning Analytics</h1><p>Mastery estimates use recent answer accuracy with more weight on recent attempts. They are indicators, not exam score predictions.</p><div class="grid section"><div class="card"><h2>'+a.length+'</h2><p>Answers attempted</p></div><div class="card"><h2>'+avg+'%</h2><p>Overall accuracy</p></div><div class="card"><h2>'+nextReview()+'</h2><p>Questions to review</p></div></div><h2>Topic mastery</h2><div class="grid section">'+(rows.length?rows.map(x=>'<div class="card"><b>'+esc(x.t)+'</b><p>'+esc(courses.find(c=>c.id===x.c).title)+'</p><div class="progress"><div class="bar" style="width:'+x.m+'%"></div></div><small>'+x.m+'% estimated mastery</small></div>').join(''):'<div class="card"><p>Answer a few questions to see mastery estimates.</p></div>')+'</div><button class="btn" id="reviewWeak">Review weakest topic →</button>'}
function flashcards(){return '<h1>'+ico('cards')+' Flashcards</h1><p>Create cards from your own notes. Reveal an answer, then mark whether you remembered it to schedule review.</p><div class="card section"><label>Front</label><input class="field" id="cardFront" placeholder="Question or term"><label>Back</label><textarea class="field" id="cardBack" placeholder="Answer or explanation"></textarea><button class="btn" id="addCard">Add flashcard</button></div><h2>Cards ('+state.cards.length+')</h2><div class="grid">'+state.cards.map((c,i)=>'<div class="card"><b>'+esc(c.front)+'</b><p class="muted">Review '+(c.due&&c.due>Date.now()?new Date(c.due).toLocaleDateString():'due now')+'</p><button class="btn secondary" data-reveal="'+i+'">Reveal answer</button><div id="reveal'+i+'" class="hidden"><p>'+esc(c.back)+'</p><button class="btn secondary" data-rate="'+i+':0">Again</button> <button class="btn" data-rate="'+i+':1">Remembered</button></div></div>').join('')+'</div>'}
function notesView(){return '<h1>'+ico('file')+' Study Materials</h1><p>Add text-based notes to create an editable topic outline and simple flashcards. PDF and PowerPoint understanding require a document-processing service and are not available yet.</p><div class="card section"><label>Title</label><input id="noteTitle" class="field" placeholder="e.g. Environmental Science notes"><label>Notes</label><textarea id="noteText" class="field" rows="8" placeholder="Paste your class notes..."></textarea><label>Upload plain text / Markdown</label><input id="noteFile" class="field" type="file" accept=".txt,.md"><button class="btn" id="saveNote">Save and extract study topics</button></div><div class="grid">'+state.notes.map((n,i)=>'<div class="card"><h3>'+esc(n.title)+'</h3><p>'+n.lines.length+' study topics extracted</p><button class="btn secondary" data-use-note="'+i+'">Create flashcards</button><button class="btn secondary" data-plan-note="'+i+'">Plan study</button><details><summary>Review extracted text</summary>'+n.lines.map(t=>'<p>'+esc(t)+'</p>').join('')+'</details></div>').join('')+'</div>'}
function examLimit(course,count){return (course==='amc10'||course==='amc12')?Math.max(5,count*3)*60:Math.max(5,count*2)*60}
function clockText(sec){sec=Math.max(0,sec);return String(Math.floor(sec/60)).padStart(2,'0')+':'+String(sec%60).padStart(2,'0')}
function remaining(e){return Math.max(0,Math.ceil((e.started+e.limit*1000-Date.now())/1000))}
function finishExam(reason){if(!examSession||examSession.finished)return;examSession.finished=true;examSession.reason=reason||'completed';render()}
function syncExamClock(){if(page!=='exams'||!examSession||examSession.finished)return;const left=remaining(examSession),clock=document.getElementById('examClock'),bar=document.getElementById('examBar');if(clock){clock.textContent=clockText(left);clock.setAttribute('aria-label',clockText(left)+' remaining');if(left<=60)clock.style.color='#d94b56'}if(bar)bar.style.width=(left/examSession.limit*100)+'%';if(left===0)finishExam('time expired')}
function exams(){const ids=['amc10','amc12','sat','act','apcalc','apphysics','apenv','apstats','apeuro'];return '<h1>'+ico('clock')+' Exam Practice</h1><p>Timed mini-tests made from the available original questions. These are not full-length official exams or score predictors.</p><div class="grid">'+ids.map(id=>{const c=courses.find(c=>c.id===id),n=questions.filter(q=>q.course===id).length;return '<div class="card"><h3>'+esc(c.title)+'</h3><p>'+n+' sample questions · '+Math.round(examLimit(id,n)/60)+' minute limit</p><button class="btn" data-exam="'+id+'">Start mini-test</button></div>'}).join('')+'</div>'}
let examSession=null,questionStarted=Date.now(),examTimer=null;
function examView(){if(!examSession)return exams();const e=examSession,qs=questions.filter(q=>q.course===e.course),q=qs[e.index],elapsed=Math.floor((Date.now()-e.started)/1000);if(e.finished||!q){const n=e.answers.filter(a=>a.correct).length;return '<h1>Exam review</h1><div class="card"><h2>'+n+' / '+qs.length+' correct</h2><p>'+e.answers.length+' answered · '+clockText(elapsed)+' elapsed · '+esc(e.reason||'completed')+'. Unanswered questions count as incorrect. Results are not official scores.</p>'+e.answers.map(a=>'<p>'+esc(a.q)+' — '+(a.correct?'Correct':'Incorrect')+'</p>').join('')+'<button class="btn" id="finishExam">Return to exam selection</button></div>'}return '<h1>'+ico('clock')+' '+esc(courses.find(c=>c.id===e.course).title)+' mini-test</h1><div class="card" style="margin:16px 0"><div style="display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap"><strong>Question '+(e.index+1)+' of '+qs.length+'</strong><div><small>Time remaining</small><div id="examClock" role="timer" aria-live="off" style="font-size:30px;font-weight:800;font-variant-numeric:tabular-nums">'+clockText(remaining(e))+'</div></div></div><div class="progress" style="margin-top:12px"><div id="examBar" class="bar" style="width:'+(remaining(e)/e.limit*100)+'%;transition:width .9s linear"></div></div><small>Limit: '+Math.round(e.limit/60)+' minutes · Automatically submits when time runs out</small></div><div class="card section"><h2>'+esc(q.q)+'</h2>'+q.a.map((a,i)=>'<button class="option" data-exam-answer="'+i+'">'+String.fromCharCode(65+i)+'. '+esc(a)+'</button>').join('')+'</div><button class="btn secondary" id="finishExam">End test</button>'}
let page='home',chosen='amc10',attempt=null,selectedTopic='',questionIndex=0;
function save(){localStorage.setItem('orbit-v1',JSON.stringify(state));document.getElementById('xp').textContent=state.xp;document.getElementById('streak').textContent=currentStreak()}

function go(p){page=p;attempt=null;questionStarted=Date.now();if(p==='practice')questionIndex=0;render();window.scrollTo(0,0)}
function nav(){const entries=[["home","Home","house"],["courses","Explore Courses","book"],["practice","Practice","pen"],["planner","Study Planner","calendar"],["progress","My Progress","award"],["analytics","Analytics","chart"],["flashcards","Flashcards","cards"],["notes","My Notes","file"],["exams","Exam Practice","clock"]];document.getElementById('nav').innerHTML=entries.map(function(e){return '<button class="'+(page===e[0]?'active':'')+'" data-page="'+e[0]+'"><span class="nav-icon">'+ico(e[2])+'</span>'+e[1]+'</button>'}).join('');document.querySelectorAll('[data-page]').forEach(function(b){b.onclick=function(){go(b.dataset.page)}})}
function tile(c){return '<div class="card subject"><div class="emoji">'+ico(c.icon)+'</div><h3>'+c.title+'</h3><p>'+c.type+' · '+c.topics.length+' topics</p><button class="btn secondary" data-course="'+c.id+'">Explore →</button></div>'}
function wireCourses(){document.querySelectorAll('[data-course]').forEach(function(b){b.onclick=function(){chosen=b.dataset.course;selectedTopic='';go('course')}})}
function home(){return '<div class="hero"><div><div class="eyebrow">Welcome back, explorer!</div><h1>Small steps. Big discoveries.</h1><p>Meet Cosmo, your study buddy. Pick up a lesson or build a study plan around your next exam.</p><button class="btn" data-page="courses">Start learning →</button></div><div class="mascot" role="img" aria-label="Cosmo, a smiling pastel planet with a lavender orbit ring"><span class="orbit-ring"></span><span class="planet"><span class="eye left"></span><span class="eye right"></span><span class="blush left"></span><span class="blush right"></span><span class="smile"></span></span><span class="orbit-front"></span><span class="star">✦</span></div></div><div class="section"><h2>Your learning tracks</h2><div class="grid">'+courses.slice(0,6).map(tile).join('')+'</div></div><div class="section card"><h2>Plan your next study session</h2><p>Preparing for AMC, SAT, ACT, an AP exam, or a school test? Turn your goals and notes into daily tasks.</p><button class="btn" data-page="planner">Create my plan →</button></div>'}
function course(){const c=courses.find(function(x){return x.id===chosen})||courses[0];return '<div class="section"><button class="btn secondary" data-page="courses">← All courses</button></div><h1>'+ico(c.icon)+' '+c.title+'</h1><p>'+c.type+' · Choose a topic to review, then practice.</p><div class="section grid">'+c.topics.map(function(t,i){return '<div class="card"><div class="eyebrow">Unit '+(i+1)+'</div><h3>'+esc(t)+'</h3><p>Review the main ideas and try a practice question.</p><button class="btn secondary" data-topic="'+i+'">Practice →</button></div>'}).join('')+'</div><p class="muted">Prototype content: these are topic outlines and sample questions, not a complete exam curriculum.</p>'}
function practice(){const relevant=questions.filter(function(q){return q.course===chosen});const list=adaptivePool();const item=list[questionIndex%Math.max(1,list.length)];return '<h1>'+ico('pen')+' Practice</h1><p>Practice questions tailored to your course and selected topic. Earn 20 XP the first time you solve each question.</p><div class="section"><label for="practicecourse">Choose course</label><select class="field" id="practicecourse">'+courses.map(function(c){return '<option value="'+c.id+'" '+(chosen===c.id?'selected':'')+'>'+c.title+'</option>'}).join('')+'</select></div>'+(relevant.length?'<div class="section"><label for="practicetopic">Choose topic</label><select class="field" id="practicetopic"><option value="">All topics</option>'+courses.find(function(c){return c.id===chosen}).topics.map(function(t){return '<option value="'+esc(t)+'" '+(selectedTopic===t?'selected':'')+'>'+esc(t)+'</option>'}).join('')+'</select></div>':'')+(item?'<div class="card section"><div class="eyebrow">'+esc(item.topic)+'</div><h2 style="margin-top:12px">'+esc(item.q)+'</h2>'+item.a.map(function(a,i){return '<button class="option '+(attempt!==null?(i===item.correct?'right':i===attempt?'wrong':''):'')+'" data-answer="'+i+'" '+(attempt!==null?'disabled':'')+'>'+String.fromCharCode(65+i)+'. '+esc(a)+'</button>'}).join('')+(attempt!==null?'<p><b>'+(attempt===item.correct?'Great work! '+ico('sparkles')+'':'Keep learning!')+'</b> '+esc(item.why)+'</p>':'')+'<p class="muted">Question '+(questionIndex%list.length+1)+' of '+list.length+'</p><button class="btn secondary" id="nextQuestion" '+(list.length<2?'disabled':'')+'>Next question →</button></div>':'<div class="card section"><h2>No questions in this topic yet</h2><p>This topic needs a dedicated question set. Try another topic.</p></div>')+'<p class="muted">Original practice questions for this prototype; not official AMC problems.</p>'}
function planner(){return '<h1>'+ico('calendar')+' Your Study Planner</h1><p>Turn your exam goal and pasted notes into a practical schedule. This version runs locally in your browser, without AI.</p><div class="card section"><div class="formgrid"><div><label for="plan-course">What are you studying?</label><select class="field" id="plan-course">'+courses.filter(function(c){return c.id!=='history'}).map(function(c){return '<option value="'+c.id+'">'+c.title+'</option>'}).join('')+'</select></div><div><label for="examdate">Exam date</label><input class="field" id="examdate" type="date"></div><div><label for="minutes">Minutes per day</label><select class="field" id="minutes"><option value="20">20 minutes</option><option value="30">30 minutes</option><option value="45" selected>45 minutes</option><option value="60">60 minutes</option><option value="90">90 minutes</option></select></div><div><label for="weak">Topics you find hardest</label><input class="field" id="weak" placeholder="e.g. factoring, probability"></div></div><label for="notes">Paste your notes (optional)</label><textarea class="field" id="notes" placeholder="Paste lesson notes, a study guide, or vocabulary here..."></textarea><label for="upload">Or upload a text file</label><input type="file" accept=".txt,.md,text/plain,text/markdown" id="upload" class="field"><p class="muted">Only .txt and .md files are supported in this prototype.</p><button class="btn" id="generate">Generate my plan '+ico('sparkles')+'</button></div><div id="planresult"></div>'}
function makePlan(){const id=document.getElementById('plan-course').value,c=courses.find(function(x){return x.id===id}),raw=document.getElementById('notes').value,weak=document.getElementById('weak').value.split(',').map(function(t){return t.trim()}).filter(Boolean),topics=weak.concat(c.topics),lines=raw.split(/\n+/).map(function(x){return x.trim().replace(/^[-*#0-9. ]+/,'')}).filter(function(x){return x.length>5}).slice(0,12);const all=topics.concat(lines.length?lines:[]);let d=document.getElementById('examdate').value;let days=7;if(d){const date=new Date(d+'T12:00:00'),now=new Date();now.setHours(12,0,0,0);days=Math.ceil((date-now)/86400000)}days=Math.max(1,Math.min(60,days));const min=Number(document.getElementById('minutes').value);state.tasks=Array.from({length:days},function(_,i){return {label:'Day '+(i+1)+': '+all[i%all.length]+' — study '+Math.max(10,min-10)+' min, practice 10 min',done:false}});state.planCourse=c.title;save();showPlan()}
function showPlan(){const el=document.getElementById('planresult');if(!el)return;if(!state.tasks.length){el.innerHTML='';return}el.innerHTML='<div class="card section"><h2>'+ico('sparkles')+' '+esc(state.planCourse||'Your')+' study plan</h2><p>Check off each day as you finish it. Revisit weak topics during review.</p>'+state.tasks.map(function(t,i){return '<label class="task"><input type="checkbox" data-task="'+i+'" '+(t.done?'checked':'')+'><span>'+esc(t.label)+'</span><button type="button" class="btn secondary" data-start-task="'+i+'">Practice</button></label>'}).join('')+'<button class="btn secondary" id="reschedule">Reschedule unfinished tasks</button> <button class="btn secondary" id="download">Download plan</button></div>';document.querySelectorAll('[data-task]').forEach(function(el){el.onchange=function(){const task=state.tasks[Number(el.dataset.task)];task.done=el.checked;if(el.checked&&!task.countedActivity){task.countedActivity=true;recordActivity()}save()}});document.querySelectorAll('[data-start-task]').forEach(b=>b.onclick=function(){const t=state.tasks[+b.dataset.startTask],guess=courses.find(c=>c.title===state.planCourse);if(guess){chosen=guess.id;selectedTopic=guess.topics.find(x=>t.label.toLowerCase().includes(x.toLowerCase()))||''}go('practice')});document.getElementById('reschedule').onclick=function(){state.tasks=state.tasks.filter(t=>!t.done).map((t,i)=>({...t,label:t.label.replace(/^Day \\d+:/,'Day '+(i+1)+':')}));save();showPlan()};document.getElementById('download').onclick=function(){const blob=new Blob([state.tasks.map(function(t){return (t.done?'[x] ':'[ ] ')+t.label}).join('\n')],{type:'text/plain'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='orbit-study-plan.txt';a.click();URL.revokeObjectURL(a.href)}}
function progress(){const finished=Object.keys(state.done).length;return '<h1>'+ico('award')+' Your Progress</h1><div class="grid section"><div class="card"><div class="emoji">'+ico('bolt')+'</div><h2>'+state.xp+' XP</h2><p>Total earned</p></div><div class="card"><div class="emoji">'+ico('check')+'</div><h2>'+finished+'</h2><p>Practice questions mastered</p></div><div class="card"><div class="emoji">'+ico('calendar')+'</div><h2>'+state.tasks.filter(function(t){return t.done}).length+'/'+state.tasks.length+'</h2><p>Study-plan tasks completed</p></div></div><p>Progress is stored in this browser only. It does not sync between devices.</p>'}
function render(){nav();const el=document.getElementById('view');el.innerHTML=page==='home'?home():page==='courses'?'<h1>Explore courses</h1><p>Competition math, standardized tests, AP, and everyday school subjects.</p><div class="section grid">'+courses.map(tile).join('')+'</div>':page==='course'?course():page==='practice'?practice():page==='planner'?planner():page==='progress'?progress():page==='analytics'?analytics():page==='flashcards'?flashcards():page==='notes'?notesView():page==='exams'?examView():progress();document.querySelectorAll('[data-page]').forEach(function(b){b.onclick=function(){go(b.dataset.page)}});wireCourses();if(page==='course'){document.querySelectorAll('[data-topic]').forEach(function(b){b.onclick=function(){selectedTopic=courses.find(function(c){return c.id===chosen}).topics[Number(b.dataset.topic)];go('practice')}})}if(page==='practice'){document.getElementById('practicecourse').onchange=function(e){chosen=e.target.value;selectedTopic='';questionIndex=0;attempt=null;render()};if(document.getElementById('practicetopic'))document.getElementById('practicetopic').onchange=function(e){selectedTopic=e.target.value;questionIndex=0;attempt=null;render()};if(document.getElementById('nextQuestion'))document.getElementById('nextQuestion').onclick=function(){questionIndex++;attempt=null;questionStarted=Date.now();render()};document.querySelectorAll('[data-answer]').forEach(function(b){b.onclick=function(){attempt=Number(b.dataset.answer);const pool=adaptivePool();const q=pool[questionIndex%pool.length];const key=q.course+':'+q.topic+':'+q.q;recordAnswer(q,attempt===q.correct,Math.round((Date.now()-questionStarted)/1000));render()}})}if(page==='analytics'){document.getElementById('reviewWeak').onclick=function(){const rows=courses.flatMap(c=>c.topics.map(t=>({id:c.id,t,m:mastery(c.id,t)}))).filter(r=>r.m!==null).sort((a,b)=>a.m-b.m);if(rows.length){chosen=rows[0].id;selectedTopic=rows[0].t;go('practice')}else go('practice')}}if(page==='flashcards'){document.getElementById('addCard').onclick=function(){const front=document.getElementById('cardFront').value.trim(),back=document.getElementById('cardBack').value.trim();if(front&&back){state.cards.push({front,back,due:0,interval:1});save();render()}};document.querySelectorAll('[data-reveal]').forEach(b=>b.onclick=function(){document.getElementById('reveal'+b.dataset.reveal).classList.remove('hidden')});document.querySelectorAll('[data-rate]').forEach(b=>b.onclick=function(){const [i,ok]=b.dataset.rate.split(':').map(Number),c=state.cards[i];c.interval=ok?Math.min(30,(c.interval||1)*2):1;c.due=Date.now()+(ok?c.interval:0)*86400000;save();render()})}if(page==='notes'){document.getElementById('noteFile').onchange=async function(e){const f=e.target.files[0];if(f&&f.size<=200000)document.getElementById('noteText').value=await f.text()};document.getElementById('saveNote').onclick=function(){const raw=document.getElementById('noteText').value,title=document.getElementById('noteTitle').value.trim()||'My Notes';const lines=raw.split(/\n+/).map(x=>x.trim()).filter(x=>x.length>8).slice(0,30);if(!lines.length)return alert('Please add some notes first.');state.notes.push({title,lines});save();render()};document.querySelectorAll('[data-use-note]').forEach(b=>b.onclick=function(){const n=state.notes[+b.dataset.useNote];n.lines.slice(0,15).forEach(t=>state.cards.push({front:'Explain: '+t.slice(0,65),back:t,due:0,interval:1}));save();go('flashcards')});document.querySelectorAll('[data-plan-note]').forEach(b=>b.onclick=function(){const n=state.notes[+b.dataset.planNote];state.tasks=n.lines.map((t,i)=>({label:'Day '+(i+1)+': '+t,done:false}));state.planCourse=n.title;save();go('planner')})}if(page==='exams'){document.querySelectorAll('[data-exam]').forEach(b=>b.onclick=function(){const id=b.dataset.exam;examSession={course:id,index:0,started:Date.now(),limit:examLimit(id,questions.filter(q=>q.course===id).length),answers:[],finished:false};render()});document.querySelectorAll('[data-exam-answer]').forEach(b=>b.onclick=function(){const e=examSession,q=questions.filter(x=>x.course===e.course)[e.index];if(!e||e.finished)return;if(remaining(e)===0){finishExam('time expired');return}e.answers.push({q:q.q,correct:Number(b.dataset.examAnswer)===q.correct});e.index++;if(e.index>=questions.filter(x=>x.course===e.course).length)finishExam('completed');else render()});if(document.getElementById('finishExam'))document.getElementById('finishExam').onclick=function(){if(examSession&&!examSession.finished)finishExam('ended early');else{examSession=null;render()}};if(examTimer)clearInterval(examTimer);examTimer=setInterval(syncExamClock,250);syncExamClock()}if(page==='planner'){document.getElementById('generate').onclick=makePlan;document.getElementById('upload').onchange=async function(e){const f=e.target.files[0];if(f){if(f.size>200000){alert('Please upload a text file smaller than 200 KB.');return}document.getElementById('notes').value=await f.text()}};showPlan()}}
save();render();
window.addEventListener('focus',save);
document.addEventListener('visibilitychange',function(){if(!document.hidden)save()});
</script></body></html>
