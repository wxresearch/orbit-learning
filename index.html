<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Orbit — Your Learning Space</title>
<style>
:root{font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:#27334b;background:#f7f9fe}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid #b5aaff}.app{min-height:100vh;display:grid;grid-template-columns:225px minmax(0,1fr)}aside{background:white;border-right:1px solid #e7eaf3;padding:26px 15px;display:flex;flex-direction:column;gap:20px}.brand{font-size:26px;font-weight:900;letter-spacing:-1px;padding:12px;color:#6c57dc}.brand span{background:#765ce6;color:white;border-radius:12px;padding:6px;margin-right:8px}nav{display:grid;gap:6px}nav button{border:0;background:transparent;border-radius:12px;padding:14px;text-align:left;color:#626e87;font-weight:700}nav button.active,nav button:hover{color:#6750d9;background:#eeeaff}main{max-width:1240px;width:100%;margin:0 auto;padding:35px 44px 80px}.top{display:flex;gap:12px;align-items:center;justify-content:space-between}.stats{display:flex;gap:8px;flex-wrap:wrap}.pill{padding:10px 13px;border-radius:30px;background:white;border:1px solid #e8ebf2;font-weight:700}h1{font-size:32px;letter-spacing:-1px;margin:9px 0}h2{font-size:21px;margin:0 0 15px}h3{margin:0 0 8px}p{color:#718097;line-height:1.6;margin:0 0 12px}.muted{font-size:13px;color:#7b879d}.eyebrow{color:#8a94a9;text-transform:uppercase;letter-spacing:.1em;font-size:12px;font-weight:800}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.card{background:white;border:1px solid #e9ecf4;border-radius:20px;padding:22px;box-shadow:0 3px 16px #21345b08}.hero{display:grid;grid-template-columns:1fr auto;align-items:center;background:linear-gradient(110deg,#eeeaff,#e7f9f7);border-radius:24px;padding:28px;margin:23px 0;gap:15px}.mascot{width:150px;height:150px;position:relative;flex:none;display:grid;place-items:center;filter:drop-shadow(0 12px 11px #4d60a52a);animation:floatcosmo 4s ease-in-out infinite}.mascot .orbit-ring{position:absolute;width:158px;height:64px;left:-4px;top:43px;border:11px solid #b8a2f6;border-radius:50%;transform:rotate(-22deg);z-index:0;box-sizing:border-box}.mascot .orbit-front{position:absolute;width:158px;height:64px;left:-4px;top:43px;border:11px solid transparent;border-bottom-color:#9277e5;border-left-color:#a58bea;border-right-color:#a58bea;border-radius:50%;transform:rotate(-22deg);z-index:3;box-sizing:border-box;clip-path:inset(49% -20% -20% -20%)}.mascot .planet{position:relative;z-index:1;width:108px;height:108px;border-radius:50%;background:linear-gradient(145deg,#b3f7ed,#81ddeb 70%,#7aa8e8);box-shadow:inset -12px -11px 0 #65b6d429,inset 7px 8px 0 #ffffff55;border:3px solid #ffffffa3}.mascot .eye{position:absolute;width:12px;height:17px;background:#283a62;border-radius:50%;top:42px}.mascot .eye.left{left:28px}.mascot .eye.right{right:28px}.mascot .eye:after{content:'';position:absolute;width:4px;height:5px;left:2px;top:2px;border-radius:50%;background:white}.mascot .smile{position:absolute;left:46px;top:59px;width:15px;height:10px;border-bottom:3px solid #334567;border-radius:50%}.mascot .blush{position:absolute;top:61px;width:19px;height:9px;background:#f8a8ba88;border-radius:50%}.mascot .blush.left{left:12px}.mascot .blush.right{right:12px}.mascot .star{position:absolute;z-index:3;color:#f4b94d;font-size:23px;top:3px;right:-4px}@keyframes floatcosmo{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}@media(prefers-reduced-motion:reduce){.mascot{animation:none}}.btn{background:#7059e8;color:white;border:0;border-radius:12px;padding:12px 18px;font-weight:800}.btn:hover{background:#5842cf}.btn.secondary{background:#eeeaff;color:#6852d3}.btn:disabled{opacity:.5;cursor:default}.section{margin:26px 0}.emoji{font-size:30px}.progress{height:10px;background:#e9edf5;border-radius:20px;overflow:hidden}.bar{height:100%;background:#8067e9;border-radius:20px}.subject{display:flex;flex-direction:column;gap:9px}.subject button{margin-top:auto}.subject p{flex:1}label{font-weight:700;display:block;margin:16px 0 6px}.field{border:1px solid #d9e0ee;background:white;padding:11px 12px;border-radius:11px;width:100%;color:#29354d}textarea{min-height:118px;resize:vertical}.formgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:0 18px}.option{display:block;text-align:left;width:100%;padding:14px;border:1px solid #dfe4ef;background:white;margin:10px 0;border-radius:12px}.option:hover{background:#f5f2ff}.option.right{border-color:#25a47e;background:#e8faf4}.option.wrong{border-color:#e2798e;background:#fff0f3}.task{display:flex;gap:10px;align-items:flex-start;padding:12px;border-bottom:1px solid #ecedf3}.task input{margin-top:5px}small{color:#7e8aa0}footer{margin-top:auto;padding:12px;color:#9aa4b5;font-size:12px}.hidden{display:none!important}@media(max-width:940px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}main{padding:24px}.app{grid-template-columns:180px minmax(0,1fr)}}@media(max-width:680px){.app{display:block}aside{padding:12px;position:sticky;top:0;z-index:10;gap:6px;box-shadow:0 3px 9px #172d4c10}.brand{font-size:20px;padding:5px}nav{display:flex;overflow-x:auto;white-space:nowrap}nav button{padding:9px}footer{display:none}main{padding:20px 15px}.grid,.formgrid{grid-template-columns:1fr}.hero{padding:18px}.mascot{font-size:50px}.top{align-items:start;flex-direction:column}h1{font-size:26px}}
</style></head>
<body><div class="app"><aside><div class="brand"><span>✦</span>Orbit</div><nav id="nav"></nav><footer>Your space to learn anything ✨</footer></aside><main><div class="top"><div class="eyebrow">Your learning space</div><div class="stats"><span class="pill">🔥 <b id="streak">1</b> day streak</span><span class="pill">⚡ <b id="xp">0</b> XP</span></div></div><div id="view"></div></main></div>
<script>
const courses=[
{id:'amc10',title:'AMC 10',type:'Competition Math',icon:'🧠',color:'#7159d9',topics:['Algebra','Geometry','Counting and Probability','Number Theory','Problem-Solving Strategies']},
{id:'amc12',title:'AMC 12',type:'Competition Math',icon:'🏆',color:'#7159d9',topics:['Advanced Algebra','Geometry','Combinatorics','Number Theory','Trigonometry']},
{id:'sat',title:'SAT',type:'Standardized Test',icon:'🎯',color:'#278fb6',topics:['Algebra','Advanced Math','Problem Solving and Data Analysis','Geometry and Trigonometry','Reading and Writing']},
{id:'act',title:'ACT',type:'Standardized Test',icon:'🚀',color:'#278fb6',topics:['English','Math','Reading','Science Reasoning']},
{id:'apcalc',title:'AP Calculus BC',type:'AP Course',icon:'📐',color:'#e6a342',topics:['Limits and Continuity','Differentiation','Applications of Derivatives','Integration and Accumulation of Change','Differential Equations','Applications of Integration','Parametric Equations, Polar Coordinates, and Vector-Valued Functions','Infinite Sequences and Series']},
{id:'apphysics',title:'AP Physics 1',type:'AP Course',icon:'⚛️',color:'#6f72d9',topics:['Kinematics','Force and Translational Dynamics','Work, Energy, and Power','Linear Momentum','Torque and Rotational Dynamics','Energy and Momentum of Rotating Systems','Oscillations','Fluids']},
{id:'apenv',title:'AP Environmental Science',type:'AP Course',icon:'🌿',color:'#26a18a',topics:['The Living World: Ecosystems','The Living World: Biodiversity','Populations','Earth Systems and Resources','Land and Water Use','Energy Resources and Consumption','Atmospheric Pollution','Aquatic and Terrestrial Pollution','Global Change']},
{id:'apstats',title:'AP Statistics',type:'AP Course',icon:'📊',color:'#bd6fbe',topics:['Exploring One-Variable Data','Exploring Two-Variable Data','Collecting Data','Probability, Random Variables, and Probability Distributions','Sampling Distributions','Inference for Categorical Data: Proportions','Inference for Quantitative Data: Means','Inference for Categorical Data: Chi-Square','Inference for Quantitative Data: Slopes']},
{id:'apeuro',title:'AP European History',type:'AP Course',icon:'🏛️',color:'#d88151',topics:['Renaissance and Exploration','Age of Reformation','Absolutism and Constitutionalism','Scientific, Philosophical, and Political Developments','Conflict, Crisis, and Reaction','Industrialization and Its Effects','19th-Century Perspectives and Political Developments','20th-Century Global Conflicts','Cold War and Contemporary Europe']},
{id:'science',title:'School Science',type:'School Class',icon:'🔬',color:'#259e88',topics:['Biology','Chemistry','Physics','Earth Science']},
{id:'english',title:'English',type:'School Class',icon:'📚',color:'#cd7a72',topics:['Grammar','Reading','Writing','Literature']},
{id:'history',title:'History',type:'School Class',icon:'🌍',color:'#b88a44',topics:['World History','Civics','Geography','Historical Analysis']}
];
const questions=[
{"course":"amc10","topic":"Algebra","q":"Positive integers a and b satisfy a+b=14 and ab=40. What is a²+b²?","a":["96","100","108","116"],"correct":3,"why":"a²+b²=(a+b)²−2ab=196−80=116."},
{"course":"amc10","topic":"Geometry","q":"A square has side length 10. The midpoints of its sides are joined to form a smaller square. What is the area of the smaller square?","a":["25","40","50","75"],"correct":2,"why":"Its diagonals are both 10, so its area is (10×10)/2=50."},
{"course":"amc10","topic":"Counting and Probability","q":"Two fair six-sided dice are rolled. What is the probability that their sum is at least 10?","a":["1/12","1/6","5/18","1/4"],"correct":1,"why":"Sums of 10, 11, 12 occur in 3+2+1=6 of the 36 equally likely outcomes, so 1/6."},
{"course":"amc10","topic":"Number Theory","q":"What is the smallest positive integer that is divisible by 6 and 8 and leaves remainder 1 when divided by 5?","a":["24","48","72","96"],"correct":3,"why":"Multiples of lcm(6,8)=24 are 24,48,72,96; 96 leaves remainder 1 modulo 5."},
{"course":"amc10","topic":"Problem-Solving Strategies","q":"A sequence starts with 2. Each new term is 3 more than twice the previous term. What is the fourth term?","a":["29","37","41","47"],"correct":1,"why":"The terms are 2, 7, 17, 37."},
{"course":"amc12","topic":"Advanced Algebra","q":"If x+1/x=3 for nonzero real x, what is x³+1/x³?","a":["9","15","18","21"],"correct":2,"why":"(x+1/x)³=x³+1/x³+3(x+1/x), so the result is 27−9=18."},
{"course":"amc12","topic":"Geometry","q":"A triangle has side lengths 13, 14, and 15. What is its area?","a":["72","78","84","90"],"correct":2,"why":"Heron's formula with semiperimeter 21 gives √(21×8×7×6)=84."},
{"course":"amc12","topic":"Combinatorics","q":"How many 4-digit integers have strictly increasing digits from left to right?","a":["84","126","210","252"],"correct":1,"why":"Choose any 4 digits from 1 through 9; each set has one increasing order. C(9,4)=126. Zero cannot appear first in an increasing 4-digit number."},
{"course":"amc12","topic":"Number Theory","q":"How many positive divisors of 360 are perfect squares?","a":["3","4","6","9"],"correct":1,"why":"360=2³×3²×5¹. A square divisor uses exponents 0 or 2 for 2 and 3, and 0 for 5: 2×2×1=4."},
{"course":"amc12","topic":"Trigonometry","q":"If sin θ=3/5 and θ lies in quadrant II, what is cos(2θ)?","a":["−7/25","7/25","−24/25","24/25"],"correct":1,"why":"cos(2θ)=1−2sin²θ=1−18/25=7/25."},
{course:'sat',topic:'Algebra',q:'If 2(x − 3) = 14, what is x?',a:['4','7','10','17'],correct:2,why:'Divide by 2: x − 3 = 7, so x = 10.'},
{course:'sat',topic:'Reading and Writing',q:'Choose the grammatically correct sentence.',a:['Each of the students have a book.','Each of the students has a book.','Each students has a book.','Each of the student have a book.'],correct:1,why:'The singular subject “each” takes the singular verb “has.”'},
{course:'act',topic:'Math',q:'A right triangle has legs 6 and 8. What is its hypotenuse?',a:['9','10','12','14'],correct:1,why:'By the Pythagorean theorem, the hypotenuse is the square root of 36 + 64 = 10.'},
{course:'act',topic:'Science Reasoning',q:'In an experiment, which variable is deliberately changed by the researcher?',a:['Dependent variable','Controlled variable','Independent variable','Response variable'],correct:2,why:'The independent variable is manipulated; the dependent variable is measured.'},
{course:'apcalc',topic:'Differentiation',q:'What is the derivative of x³?',a:['x²','3x²','3x','x⁴/4'],correct:1,why:'Use the power rule: d(xⁿ)/dx = nxⁿ⁻¹.'},
{course:'apphysics',topic:'Kinematics',q:'Starting from rest at constant acceleration 2 m/s², what is velocity after 5 s?',a:['2 m/s','5 m/s','10 m/s','25 m/s'],correct:2,why:'v = u + at = 0 + (2)(5) = 10 m/s.'},
{course:'apenv',topic:'Populations',q:'Which term describes the maximum population size an environment can sustainably support?',a:['Birth rate','Carrying capacity','Growth rate','Population density'],correct:1,why:'Carrying capacity is the largest population an environment can support over time.'},
{course:'apstats',topic:'Exploring One-Variable Data',q:'Which statistic is most resistant to extreme outliers?',a:['Mean','Range','Median','Standard deviation'],correct:2,why:'The median is based on order and is less influenced by extreme values.'},
{course:'apeuro',topic:'Renaissance and Exploration',q:'Which movement emphasized classical learning and human potential during the Renaissance?',a:['Humanism','Romanticism','Realism','Mercantilism'],correct:0,why:'Renaissance humanism emphasized classical texts, education, and human abilities.'},
{course:'science',topic:'Chemistry',q:'What is the chemical symbol for sodium?',a:['S','So','Na','N'],correct:2,why:'Na comes from sodium’s Latin name, natrium.'},
{course:'english',topic:'Grammar',q:'Which word is an adverb in “She spoke softly”?',a:['She','spoke','softly','none'],correct:2,why:'Softly describes how she spoke.'},
{course:'history',topic:'World History',q:'Which ancient civilization built the pyramids at Giza?',a:['Romans','Egyptians','Greeks','Persians'],correct:1,why:'The Giza pyramids were built in ancient Egypt.'}
];
let state;try{state=JSON.parse(localStorage.getItem('orbit-v1'))||{}}catch{state={}}
if(!state||typeof state!=='object'||Array.isArray(state))state={};
state.done=state.done&&typeof state.done==='object'&&!Array.isArray(state.done)?state.done:{};
state.tasks=Array.isArray(state.tasks)?state.tasks:[];
state.xp=Number.isSafeInteger(state.xp)&&state.xp>=0?state.xp:0;
state.streak=Number.isSafeInteger(state.streak)&&state.streak>=0?state.streak:0;
function localDay(date=new Date()){return date.getFullYear()+'-'+String(date.getMonth()+1).padStart(2,'0')+'-'+String(date.getDate()).padStart(2,'0')}
function studyDay(){return localDay()}
function previousDay(){const d=new Date();d.setDate(d.getDate()-1);return localDay(d)}
if(!/^\\d{4}-\\d{2}-\\d{2}$/.test(state.lastStudyDate||'')){state.lastStudyDate=null;state.streak=0}
function recordActivity(){const today=studyDay();if(state.lastStudyDate===today)return;state.streak=state.lastStudyDate===previousDay()?state.streak+1:1;state.lastStudyDate=today}
function currentStreak(){if(!state.lastStudyDate)return 0;return state.lastStudyDate===studyDay()||state.lastStudyDate===previousDay()?state.streak:0}

/* Learning upgrades: source-aware question history, mastery, review, notes, and exams. */
state.attempts=Array.isArray(state.attempts)?state.attempts:[];
state.cards=Array.isArray(state.cards)?state.cards:[];
state.notes=Array.isArray(state.notes)?state.notes:[];
function questionKey(q){return q.course+':'+q.topic+':'+q.q}
function attemptsFor(q){const k=questionKey(q);return state.attempts.filter(a=>a.key===k)}
function difficulty(q){return q.level||((q.course==='amc10'||q.course==='amc12')?2:1)}
function mastery(course,topic){const a=state.attempts.filter(x=>x.course===course&&x.topic===topic).slice(-12);if(!a.length)return null;const weighted=a.reduce((n,x,i)=>n+(x.correct?1:0)*(i+1),0);return Math.round(100*weighted/(a.length*(a.length+1)/2))}
function adaptivePool(){let pool=questions.filter(q=>q.course===chosen&&(!selectedTopic||q.topic===selectedTopic));if(!pool.length)return pool;const topicScores=pool.map(q=>mastery(q.course,q.topic)).filter(v=>v!==null);const score=topicScores.length?topicScores.reduce((a,b)=>a+b,0)/topicScores.length:40;const target=score>=80?4:score>=65?3:score>=40?2:1;return pool.slice().sort((a,b)=>{const pa=attemptsFor(a),pb=attemptsFor(b);const sa=(pa.length?pa[pa.length-1].correct?8:-7:0)+Math.abs(difficulty(a)-target)*8+pa.length;const sb=(pb.length?pb[pb.length-1].correct?8:-7:0)+Math.abs(difficulty(b)-target)*8+pb.length;return sa-sb})}
function recordAnswer(q,right,seconds){state.attempts.push({key:questionKey(q),course:q.course,topic:q.topic,level:difficulty(q),correct:right,seconds:Math.max(0,seconds),at:Date.now()});state.attempts=state.attempts.slice(-2000);if(right&&!state.done[questionKey(q)]){state.done[questionKey(q)]=true;state.xp+=20;}recordActivity();save()}
function nextReview(){const wrong=state.attempts.filter(a=>!a.correct);return wrong.filter(a=>{const recent=state.attempts.filter(x=>x.key===a.key).at(-1);return recent===a}).length}
function analytics(){const a=state.attempts,correct=a.filter(x=>x.correct).length,avg=a.length?Math.round(100*correct/a.length):0;const rows=courses.flatMap(c=>c.topics.map(t=>({c,t,m:mastery(c.id,t)}))).filter(x=>x.m!==null).sort((x,y)=>x.m-y.m);return '<h1>📈 Learning Analytics</h1><p>Mastery estimates use recent answer accuracy with more weight on recent attempts. They are indicators, not exam score predictions.</p><div class="grid section"><div class="card"><h2>'+a.length+'</h2><p>Answers attempted</p></div><div class="card"><h2>'+avg+'%</h2><p>Overall accuracy</p></div><div class="card"><h2>'+nextReview()+'</h2><p>Questions to review</p></div></div><h2>Topic mastery</h2><div class="grid section">'+(rows.length?rows.map(x=>'<div class="card"><b>'+esc(x.t)+'</b><p>'+esc(courses.find(c=>c.id===x.c).title)+'</p><div class="progress"><div class="bar" style="width:'+x.m+'%"></div></div><small>'+x.m+'% estimated mastery</small></div>').join(''):'<div class="card"><p>Answer a few questions to see mastery estimates.</p></div>')+'</div><button class="btn" id="reviewWeak">Review weakest topic →</button>'}
function flashcards(){return '<h1>🗂️ Flashcards</h1><p>Create cards from your own notes. Reveal an answer, then mark whether you remembered it to schedule review.</p><div class="card section"><label>Front</label><input class="field" id="cardFront" placeholder="Question or term"><label>Back</label><textarea class="field" id="cardBack" placeholder="Answer or explanation"></textarea><button class="btn" id="addCard">Add flashcard</button></div><h2>Cards ('+state.cards.length+')</h2><div class="grid">'+state.cards.map((c,i)=>'<div class="card"><b>'+esc(c.front)+'</b><p class="muted">Review '+(c.due&&c.due>Date.now()?new Date(c.due).toLocaleDateString():'due now')+'</p><button class="btn secondary" data-reveal="'+i+'">Reveal answer</button><div id="reveal'+i+'" class="hidden"><p>'+esc(c.back)+'</p><button class="btn secondary" data-rate="'+i+':0">Again</button> <button class="btn" data-rate="'+i+':1">Remembered</button></div></div>').join('')+'</div>'}
function notesView(){return '<h1>📄 Study Materials</h1><p>Add text-based notes to create an editable topic outline and simple flashcards. PDF and PowerPoint understanding require a document-processing service and are not available yet.</p><div class="card section"><label>Title</label><input id="noteTitle" class="field" placeholder="e.g. Environmental Science notes"><label>Notes</label><textarea id="noteText" class="field" rows="8" placeholder="Paste your class notes..."></textarea><label>Upload plain text / Markdown</label><input id="noteFile" class="field" type="file" accept=".txt,.md"><button class="btn" id="saveNote">Save and extract study topics</button></div><div class="grid">'+state.notes.map((n,i)=>'<div class="card"><h3>'+esc(n.title)+'</h3><p>'+n.lines.length+' study topics extracted</p><button class="btn secondary" data-use-note="'+i+'">Create flashcards</button><button class="btn secondary" data-plan-note="'+i+'">Plan study</button><details><summary>Review extracted text</summary>'+n.lines.map(t=>'<p>'+esc(t)+'</p>').join('')+'</details></div>').join('')+'</div>'}
function examLimit(course,count){return (course==='amc10'||course==='amc12')?Math.max(5,count*3)*60:Math.max(5,count*2)*60}
function clockText(sec){sec=Math.max(0,sec);return String(Math.floor(sec/60)).padStart(2,'0')+':'+String(sec%60).padStart(2,'0')}
function remaining(e){return Math.max(0,Math.ceil((e.started+e.limit*1000-Date.now())/1000))}
function finishExam(reason){if(!examSession||examSession.finished)return;examSession.finished=true;examSession.reason=reason||'completed';render()}
function syncExamClock(){if(page!=='exams'||!examSession||examSession.finished)return;const left=remaining(examSession),clock=document.getElementById('examClock'),bar=document.getElementById('examBar');if(clock){clock.textContent=clockText(left);clock.setAttribute('aria-label',clockText(left)+' remaining');if(left<=60)clock.style.color='#d94b56'}if(bar)bar.style.width=(left/examSession.limit*100)+'%';if(left===0)finishExam('time expired')}
function exams(){const ids=['amc10','amc12','sat','act','apcalc','apphysics','apenv','apstats','apeuro'];return '<h1>⏱️ Exam Practice</h1><p>Timed mini-tests made from the available original questions. These are not full-length official exams or score predictors.</p><div class="grid">'+ids.map(id=>{const c=courses.find(c=>c.id===id),n=questions.filter(q=>q.course===id).length;return '<div class="card"><h3>'+esc(c.title)+'</h3><p>'+n+' sample questions · '+Math.round(examLimit(id,n)/60)+' minute limit</p><button class="btn" data-exam="'+id+'">Start mini-test</button></div>'}).join('')+'</div>'}
let examSession=null,questionStarted=Date.now(),examTimer=null;
function examView(){if(!examSession)return exams();const e=examSession,qs=questions.filter(q=>q.course===e.course),q=qs[e.index],elapsed=Math.floor((Date.now()-e.started)/1000);if(e.finished||!q){const n=e.answers.filter(a=>a.correct).length;return '<h1>Exam review</h1><div class="card"><h2>'+n+' / '+qs.length+' correct</h2><p>'+e.answers.length+' answered · '+clockText(elapsed)+' elapsed · '+esc(e.reason||'completed')+'. Unanswered questions count as incorrect. Results are not official scores.</p>'+e.answers.map(a=>'<p>'+esc(a.q)+' — '+(a.correct?'Correct':'Incorrect')+'</p>').join('')+'<button class="btn" id="finishExam">Return to exam selection</button></div>'}return '<h1>⏱️ '+esc(courses.find(c=>c.id===e.course).title)+' mini-test</h1><div class="card" style="margin:16px 0"><div style="display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap"><strong>Question '+(e.index+1)+' of '+qs.length+'</strong><div><small>Time remaining</small><div id="examClock" role="timer" aria-live="off" style="font-size:30px;font-weight:800;font-variant-numeric:tabular-nums">'+clockText(remaining(e))+'</div></div></div><div class="progress" style="margin-top:12px"><div id="examBar" class="bar" style="width:'+(remaining(e)/e.limit*100)+'%;transition:width .9s linear"></div></div><small>Limit: '+Math.round(e.limit/60)+' minutes · Automatically submits when time runs out</small></div><div class="card section"><h2>'+esc(q.q)+'</h2>'+q.a.map((a,i)=>'<button class="option" data-exam-answer="'+i+'">'+String.fromCharCode(65+i)+'. '+esc(a)+'</button>').join('')+'</div><button class="btn secondary" id="finishExam">End test</button>'}
let page='home',chosen='amc10',attempt=null,selectedTopic='',questionIndex=0;
function save(){localStorage.setItem('orbit-v1',JSON.stringify(state));document.getElementById('xp').textContent=state.xp;document.getElementById('streak').textContent=currentStreak()}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function go(p){page=p;attempt=null;questionStarted=Date.now();if(p==='practice')questionIndex=0;render();window.scrollTo(0,0)}
function nav(){const entries=[['home','🏠 Home'],['courses','📚 Explore Courses'],['practice','✍️ Practice'],['planner','🗓️ Study Planner'],['progress','🏅 My Progress'],['analytics','📈 Analytics'],['flashcards','🗂️ Flashcards'],['notes','📄 My Notes'],['exams','⏱️ Exam Practice']];document.getElementById('nav').innerHTML=entries.map(function(e){return '<button class="'+(page===e[0]?'active':'')+'" data-page="'+e[0]+'">'+e[1]+'</button>'}).join('');document.querySelectorAll('[data-page]').forEach(function(b){b.onclick=function(){go(b.dataset.page)}})}
function tile(c){return '<div class="card subject"><div class="emoji">'+c.icon+'</div><h3>'+c.title+'</h3><p>'+c.type+' · '+c.topics.length+' topics</p><button class="btn secondary" data-course="'+c.id+'">Explore →</button></div>'}
function wireCourses(){document.querySelectorAll('[data-course]').forEach(function(b){b.onclick=function(){chosen=b.dataset.course;selectedTopic='';go('course')}})}
function home(){return '<div class="hero"><div><div class="eyebrow">Welcome back, explorer!</div><h1>Small steps. Big discoveries.</h1><p>Meet Cosmo, your study buddy. Pick up a lesson or build a study plan around your next exam.</p><button class="btn" data-page="courses">Start learning →</button></div><div class="mascot" role="img" aria-label="Cosmo, a smiling pastel planet with a lavender orbit ring"><span class="orbit-ring"></span><span class="planet"><span class="eye left"></span><span class="eye right"></span><span class="blush left"></span><span class="blush right"></span><span class="smile"></span></span><span class="orbit-front"></span><span class="star">✦</span></div></div><div class="section"><h2>Your learning tracks</h2><div class="grid">'+courses.slice(0,6).map(tile).join('')+'</div></div><div class="section card"><h2>Plan your next study session</h2><p>Preparing for AMC, SAT, ACT, an AP exam, or a school test? Turn your goals and notes into daily tasks.</p><button class="btn" data-page="planner">Create my plan →</button></div>'}
function course(){const c=courses.find(function(x){return x.id===chosen})||courses[0];return '<div class="section"><button class="btn secondary" data-page="courses">← All courses</button></div><h1>'+c.icon+' '+c.title+'</h1><p>'+c.type+' · Choose a topic to review, then practice.</p><div class="section grid">'+c.topics.map(function(t,i){return '<div class="card"><div class="eyebrow">Unit '+(i+1)+'</div><h3>'+esc(t)+'</h3><p>Review the main ideas and try a practice question.</p><button class="btn secondary" data-topic="'+i+'">Practice →</button></div>'}).join('')+'</div><p class="muted">Prototype content: these are topic outlines and sample questions, not a complete exam curriculum.</p>'}
function practice(){const relevant=questions.filter(function(q){return q.course===chosen});const list=adaptivePool();const item=list[questionIndex%Math.max(1,list.length)];return '<h1>✍️ Practice</h1><p>Practice questions tailored to your course and selected topic. Earn 20 XP the first time you solve each question.</p><div class="section"><label for="practicecourse">Choose course</label><select class="field" id="practicecourse">'+courses.map(function(c){return '<option value="'+c.id+'" '+(chosen===c.id?'selected':'')+'>'+c.title+'</option>'}).join('')+'</select></div>'+(relevant.length?'<div class="section"><label for="practicetopic">Choose topic</label><select class="field" id="practicetopic"><option value="">All topics</option>'+courses.find(function(c){return c.id===chosen}).topics.map(function(t){return '<option value="'+esc(t)+'" '+(selectedTopic===t?'selected':'')+'>'+esc(t)+'</option>'}).join('')+'</select></div>':'')+(item?'<div class="card section"><div class="eyebrow">'+esc(item.topic)+'</div><h2 style="margin-top:12px">'+esc(item.q)+'</h2>'+item.a.map(function(a,i){return '<button class="option '+(attempt!==null?(i===item.correct?'right':i===attempt?'wrong':''):'')+'" data-answer="'+i+'" '+(attempt!==null?'disabled':'')+'>'+String.fromCharCode(65+i)+'. '+esc(a)+'</button>'}).join('')+(attempt!==null?'<p><b>'+(attempt===item.correct?'Great work! 🎉':'Keep learning!')+'</b> '+esc(item.why)+'</p>':'')+'<p class="muted">Question '+(questionIndex%list.length+1)+' of '+list.length+'</p><button class="btn secondary" id="nextQuestion" '+(list.length<2?'disabled':'')+'>Next question →</button></div>':'<div class="card section"><h2>No questions in this topic yet</h2><p>This topic needs a dedicated question set. Try another topic.</p></div>')+'<p class="muted">Original practice questions for this prototype; not official AMC problems.</p>'}
function planner(){return '<h1>🗓️ Your Study Planner</h1><p>Turn your exam goal and pasted notes into a practical schedule. This version runs locally in your browser, without AI.</p><div class="card section"><div class="formgrid"><div><label for="plan-course">What are you studying?</label><select class="field" id="plan-course">'+courses.filter(function(c){return c.id!=='history'}).map(function(c){return '<option value="'+c.id+'">'+c.title+'</option>'}).join('')+'</select></div><div><label for="examdate">Exam date</label><input class="field" id="examdate" type="date"></div><div><label for="minutes">Minutes per day</label><select class="field" id="minutes"><option value="20">20 minutes</option><option value="30">30 minutes</option><option value="45" selected>45 minutes</option><option value="60">60 minutes</option><option value="90">90 minutes</option></select></div><div><label for="weak">Topics you find hardest</label><input class="field" id="weak" placeholder="e.g. factoring, probability"></div></div><label for="notes">Paste your notes (optional)</label><textarea class="field" id="notes" placeholder="Paste lesson notes, a study guide, or vocabulary here..."></textarea><label for="upload">Or upload a text file</label><input type="file" accept=".txt,.md,text/plain,text/markdown" id="upload" class="field"><p class="muted">Only .txt and .md files are supported in this prototype.</p><button class="btn" id="generate">Generate my plan ✨</button></div><div id="planresult"></div>'}
function makePlan(){const id=document.getElementById('plan-course').value,c=courses.find(function(x){return x.id===id}),raw=document.getElementById('notes').value,weak=document.getElementById('weak').value.split(',').map(function(t){return t.trim()}).filter(Boolean),topics=weak.concat(c.topics),lines=raw.split(/\n+/).map(function(x){return x.trim().replace(/^[-*#0-9. ]+/,'')}).filter(function(x){return x.length>5}).slice(0,12);const all=topics.concat(lines.length?lines:[]);let d=document.getElementById('examdate').value;let days=7;if(d){const date=new Date(d+'T12:00:00'),now=new Date();now.setHours(12,0,0,0);days=Math.ceil((date-now)/86400000)}days=Math.max(1,Math.min(60,days));const min=Number(document.getElementById('minutes').value);state.tasks=Array.from({length:days},function(_,i){return {label:'Day '+(i+1)+': '+all[i%all.length]+' — study '+Math.max(10,min-10)+' min, practice 10 min',done:false}});state.planCourse=c.title;save();showPlan()}
function showPlan(){const el=document.getElementById('planresult');if(!el)return;if(!state.tasks.length){el.innerHTML='';return}el.innerHTML='<div class="card section"><h2>✨ '+esc(state.planCourse||'Your')+' study plan</h2><p>Check off each day as you finish it. Revisit weak topics during review.</p>'+state.tasks.map(function(t,i){return '<label class="task"><input type="checkbox" data-task="'+i+'" '+(t.done?'checked':'')+'><span>'+esc(t.label)+'</span><button type="button" class="btn secondary" data-start-task="'+i+'">Practice</button></label>'}).join('')+'<button class="btn secondary" id="reschedule">Reschedule unfinished tasks</button> <button class="btn secondary" id="download">Download plan</button></div>';document.querySelectorAll('[data-task]').forEach(function(el){el.onchange=function(){const task=state.tasks[Number(el.dataset.task)];task.done=el.checked;if(el.checked&&!task.countedActivity){task.countedActivity=true;recordActivity()}save()}});document.querySelectorAll('[data-start-task]').forEach(b=>b.onclick=function(){const t=state.tasks[+b.dataset.startTask],guess=courses.find(c=>c.title===state.planCourse);if(guess){chosen=guess.id;selectedTopic=guess.topics.find(x=>t.label.toLowerCase().includes(x.toLowerCase()))||''}go('practice')});document.getElementById('reschedule').onclick=function(){state.tasks=state.tasks.filter(t=>!t.done).map((t,i)=>({...t,label:t.label.replace(/^Day \\d+:/,'Day '+(i+1)+':')}));save();showPlan()};document.getElementById('download').onclick=function(){const blob=new Blob([state.tasks.map(function(t){return (t.done?'[x] ':'[ ] ')+t.label}).join('\n')],{type:'text/plain'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='orbit-study-plan.txt';a.click();URL.revokeObjectURL(a.href)}}
function progress(){const finished=Object.keys(state.done).length;return '<h1>🏅 Your Progress</h1><div class="grid section"><div class="card"><div class="emoji">⚡</div><h2>'+state.xp+' XP</h2><p>Total earned</p></div><div class="card"><div class="emoji">✅</div><h2>'+finished+'</h2><p>Practice questions mastered</p></div><div class="card"><div class="emoji">🗓️</div><h2>'+state.tasks.filter(function(t){return t.done}).length+'/'+state.tasks.length+'</h2><p>Study-plan tasks completed</p></div></div><p>Progress is stored in this browser only. It does not sync between devices.</p>'}
function render(){nav();const el=document.getElementById('view');el.innerHTML=page==='home'?home():page==='courses'?'<h1>Explore courses</h1><p>Competition math, standardized tests, AP, and everyday school subjects.</p><div class="section grid">'+courses.map(tile).join('')+'</div>':page==='course'?course():page==='practice'?practice():page==='planner'?planner():page==='progress'?progress():page==='analytics'?analytics():page==='flashcards'?flashcards():page==='notes'?notesView():page==='exams'?examView():progress();document.querySelectorAll('[data-page]').forEach(function(b){b.onclick=function(){go(b.dataset.page)}});wireCourses();if(page==='course'){document.querySelectorAll('[data-topic]').forEach(function(b){b.onclick=function(){selectedTopic=courses.find(function(c){return c.id===chosen}).topics[Number(b.dataset.topic)];go('practice')}})}if(page==='practice'){document.getElementById('practicecourse').onchange=function(e){chosen=e.target.value;selectedTopic='';questionIndex=0;attempt=null;render()};if(document.getElementById('practicetopic'))document.getElementById('practicetopic').onchange=function(e){selectedTopic=e.target.value;questionIndex=0;attempt=null;render()};if(document.getElementById('nextQuestion'))document.getElementById('nextQuestion').onclick=function(){questionIndex++;attempt=null;questionStarted=Date.now();render()};document.querySelectorAll('[data-answer]').forEach(function(b){b.onclick=function(){attempt=Number(b.dataset.answer);const pool=adaptivePool();const q=pool[questionIndex%pool.length];const key=q.course+':'+q.topic+':'+q.q;recordAnswer(q,attempt===q.correct,Math.round((Date.now()-questionStarted)/1000));render()}})}if(page==='analytics'){document.getElementById('reviewWeak').onclick=function(){const rows=courses.flatMap(c=>c.topics.map(t=>({id:c.id,t,m:mastery(c.id,t)}))).filter(r=>r.m!==null).sort((a,b)=>a.m-b.m);if(rows.length){chosen=rows[0].id;selectedTopic=rows[0].t;go('practice')}else go('practice')}}if(page==='flashcards'){document.getElementById('addCard').onclick=function(){const front=document.getElementById('cardFront').value.trim(),back=document.getElementById('cardBack').value.trim();if(front&&back){state.cards.push({front,back,due:0,interval:1});save();render()}};document.querySelectorAll('[data-reveal]').forEach(b=>b.onclick=function(){document.getElementById('reveal'+b.dataset.reveal).classList.remove('hidden')});document.querySelectorAll('[data-rate]').forEach(b=>b.onclick=function(){const [i,ok]=b.dataset.rate.split(':').map(Number),c=state.cards[i];c.interval=ok?Math.min(30,(c.interval||1)*2):1;c.due=Date.now()+(ok?c.interval:0)*86400000;save();render()})}if(page==='notes'){document.getElementById('noteFile').onchange=async function(e){const f=e.target.files[0];if(f&&f.size<=200000)document.getElementById('noteText').value=await f.text()};document.getElementById('saveNote').onclick=function(){const raw=document.getElementById('noteText').value,title=document.getElementById('noteTitle').value.trim()||'My Notes';const lines=raw.split(/\n+/).map(x=>x.trim()).filter(x=>x.length>8).slice(0,30);if(!lines.length)return alert('Please add some notes first.');state.notes.push({title,lines});save();render()};document.querySelectorAll('[data-use-note]').forEach(b=>b.onclick=function(){const n=state.notes[+b.dataset.useNote];n.lines.slice(0,15).forEach(t=>state.cards.push({front:'Explain: '+t.slice(0,65),back:t,due:0,interval:1}));save();go('flashcards')});document.querySelectorAll('[data-plan-note]').forEach(b=>b.onclick=function(){const n=state.notes[+b.dataset.planNote];state.tasks=n.lines.map((t,i)=>({label:'Day '+(i+1)+': '+t,done:false}));state.planCourse=n.title;save();go('planner')})}if(page==='exams'){document.querySelectorAll('[data-exam]').forEach(b=>b.onclick=function(){const id=b.dataset.exam;examSession={course:id,index:0,started:Date.now(),limit:examLimit(id,questions.filter(q=>q.course===id).length),answers:[],finished:false};render()});document.querySelectorAll('[data-exam-answer]').forEach(b=>b.onclick=function(){const e=examSession,q=questions.filter(x=>x.course===e.course)[e.index];if(!e||e.finished)return;if(remaining(e)===0){finishExam('time expired');return}e.answers.push({q:q.q,correct:Number(b.dataset.examAnswer)===q.correct});e.index++;if(e.index>=questions.filter(x=>x.course===e.course).length)finishExam('completed');else render()});if(document.getElementById('finishExam'))document.getElementById('finishExam').onclick=function(){if(examSession&&!examSession.finished)finishExam('ended early');else{examSession=null;render()}};if(examTimer)clearInterval(examTimer);examTimer=setInterval(syncExamClock,250);syncExamClock()}if(page==='planner'){document.getElementById('generate').onclick=makePlan;document.getElementById('upload').onchange=async function(e){const f=e.target.files[0];if(f){if(f.size>200000){alert('Please upload a text file smaller than 200 KB.');return}document.getElementById('notes').value=await f.text()}};showPlan()}}
save();render();
window.addEventListener('focus',save);
document.addEventListener('visibilitychange',function(){if(!document.hidden)save()});
</script></body></html>
